    <script>
        var canvas = document.getElementById("bgcanvas"),
            ctx = canvas.getContext("2d"),
            w = canvas.width = window.innerWidth,
            h = canvas.height = window.innerHeight,
            particles = [],
            pos = { x: w / 2, y: h / 2 };

        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        function Particle() {
            this.x = pos.x;
            this.y = pos.y;
            this.r = 0.03;
            this.color = "#" + ((Math.random() * 0xffffff) | 0).toString(16).padStart(6, "0");
            this.vx = random(-5, 5);
            this.vy = random(-3, 3);
        }

        Particle.prototype.update = function () {
            this.x += this.vx;
            this.y += this.vy;
            this.r += 0.02;
        };

        Particle.prototype.draw = function () {
            ctx.beginPath();
            ctx.fillStyle = this.color;
            ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
            ctx.fill();
        };

        function spawn() {
            particles.push(new Particle());
        }

        function render() {
            // 用 destination-out 让上一帧逐渐变透明,形成拖尾但不遮挡下方内容
            ctx.globalCompositeOperation = "destination-out";
            ctx.fillStyle = "rgba(0,0,0,.5)";
            ctx.fillRect(0, 0, w, h);
            ctx.globalCompositeOperation = "source-over";
            for (var i = particles.length - 1; i >= 0; i--) {
                var p = particles[i];
                p.draw();
                p.update();
                if (p.r > 5) particles.splice(i, 1);
            }
        }

        (function loop() {
            spawn();
            render();
            requestAnimationFrame(loop);
        })();

        window.addEventListener('resize', function () {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            pos.x = w / 2;
            pos.y = h / 2;
        });
    </script>

            function fit() {
                var doc = frame.contentDocument;
                if (!doc || !doc.documentElement) return;
                frame.style.height = Math.ceil(doc.documentElement.getBoundingClientRect().height) + 'px';
            }

            fetch(url)
                .then(function (res) { return res.ok ? res.text() : Promise.reject(res.status); })
                .then(function (html) {
                    frame.addEventListener('load', function () {
                        fit();
                        var win = frame.contentWindow;
                        if (win && win.ResizeObserver) {
                            new win.ResizeObserver(fit).observe(frame.contentDocument.documentElement);
                        } else {
                            window.addEventListener('resize', fit);
                        }
                    }, { once: true });
                    // 加上 base,保证外部网页里的相对链接仍指向原站
                    frame.srcdoc = html.replace(/<head>/i, '<head><base href="' + url + '">');
                })
                .catch(function () {
                    // 抓取失败时退回为直接加载原地址,高度使用样式里的固定值
                    frame.src = url;
                });
        })();
    </script>

    <script>
        // 播放器:读取 script.track 生成播放列表,切歌时重新解析歌词,随音频进度高亮并滚动到当前句
        (function () {
            var audio = document.getElementById('song');
            var box = document.getElementById('lyrics');
            var name = document.getElementById('trackName');
            var prev = document.getElementById('prevBtn');
            var next = document.getElementById('nextBtn');
            if (!audio || !box || !name || !prev || !next) return;

            // 从 script.track 标签收集曲目,顺序即播放顺序
            var tracks = [].map.call(document.querySelectorAll('script.track'), function (s) {
                var sources = [s.getAttribute('data-src')];
                if (s.getAttribute('data-src-backup')) sources.push(s.getAttribute('data-src-backup'));
                return {
                    title: s.getAttribute('data-title') || '未命名',
                    artist: s.getAttribute('data-artist') || '',
                    sources: sources,
                    lrc: s.textContent
                };
            });
            if (!tracks.length) return;

            /* ---------- 歌词 ---------- */
            var offset = 0;      // 来自 [offset:毫秒] 标签,正数表示歌词整体提前
            var timed = [];      // 当前曲目带时间的句子 { time: 秒, text }
            var list = null;     // 当前歌词 <ul>,没有可滚动歌词时为 null
            var line = -1;       // 当前高亮的句子下标

            function parse(text) {
                var result = { offset: 0, timed: [], plain: [] };
                text.split(/\r?\n/).forEach(function (raw) {
                    var s = raw.trim();
                    if (!s) return;
                    var tagOffset = s.match(/^\[offset:\s*([+-]?\d+)\s*\]$/i);
                    if (tagOffset) { result.offset = Number(tagOffset[1]) / 1000; return; }
                    var times = [], re = /\[(\d+):(\d+(?:\.\d+)?)\]/g, m;
                    while ((m = re.exec(s))) times.push(Number(m[1]) * 60 + Number(m[2]));
                    var content = s.replace(/\[[^\]]*\]/g, '').trim();
                    if (times.length) {
                        times.forEach(function (time) { result.timed.push({ time: time, text: content }); });
                    } else if (content) {
                        result.plain.push({ text: content });
                    }
                });
                result.timed.sort(function (a, b) { return a.time - b.time; });
                return result;
            }

            function loadLyrics(text) {
                box.innerHTML = '';
                box.hidden = true;
                box.classList.remove('static');
                list = null; timed = []; line = -1; offset = 0;

                var parsed = parse(text);
                var items = parsed.timed.length ? parsed.timed : parsed.plain;
                if (!items.length) return;   // 纯音乐:保持隐藏

                var ul = document.createElement('ul');
                items.forEach(function (item) {
                    var li = document.createElement('li');
                    li.textContent = item.text || '♪';   // 空句(间奏)显示音符
                    ul.appendChild(li);
                });
                box.appendChild(ul);
                box.hidden = false;
                if (!parsed.timed.length) { box.classList.add('static'); return; }

                timed = parsed.timed;
                offset = parsed.offset;
                list = ul;
                stopBrowsing();
                show(-1, true);   // 切歌后直接定位,不做滚动动画
            }

            var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            // 把当前句(开唱前是第一句)滚到歌词框正中
            function center(instant) {
                if (!list) return;
                var li = list.children[Math.max(line, 0)];
                var top = li.offsetTop + li.offsetHeight / 2 - box.clientHeight / 2;
                box.scrollTo({ top: Math.round(top), behavior: instant || reduceMotion ? 'auto' : 'smooth' });
            }

            function show(index, instant) {
                if (!list) return;
                if (line >= 0) list.children[line].classList.remove('active');
                if (index >= 0) list.children[index].classList.add('active');
                line = index;
                if (!browsing) center(instant);   // 用户正在手动翻看时不打断
            }

            function sync() {
                if (!list) return;
                var t = audio.currentTime + offset, index = -1;
                while (index + 1 < timed.length && timed[index + 1].time <= t) index++;
                if (index !== line) show(index);
            }

            // 手动滑动歌词:暂停自动跟随,停止操作 3 秒后再滚回当前句
            var browsing = false, browseTimer = null;
            function startBrowsing() {
                browsing = true;
                clearTimeout(browseTimer);
                browseTimer = setTimeout(function () {
                    browsing = false;
                    center();
                }, 3000);
            }
            function stopBrowsing() {
                browsing = false;
                clearTimeout(browseTimer);
                browseTimer = null;
            }
            ['wheel', 'touchstart', 'touchmove', 'pointerdown'].forEach(function (type) {
                box.addEventListener(type, startBrowsing, { passive: true });
            });

            audio.addEventListener('timeupdate', sync);
            audio.addEventListener('seeked', sync);
            window.addEventListener('resize', function () { center(true); });

            /* ---------- 切歌 ---------- */
            var current = -1;     // 当前曲目下标
            var sourceIndex = 0;  // 当前曲目正在使用第几个地址

            function play(index) {
                current = (index + tracks.length) % tracks.length;
                sourceIndex = 0;
                var track = tracks[current];
                name.textContent = track.title + (track.artist ? ' · ' + track.artist : '');
                loadLyrics(track.lrc);
                audio.src = track.sources[0];
                // 浏览器可能禁止自动播放,失败就等用户点播放按钮
                audio.play().catch(function () {});
            }

            prev.addEventListener('click', function () { play(current - 1); });
            next.addEventListener('click', function () { play(current + 1); });

            // 主地址加载失败时换备用地址;都失败就跳到下一首
            audio.addEventListener('error', function () {
                var track = tracks[current];
                if (!track) return;
                if (++sourceIndex < track.sources.length) {
                    audio.src = track.sources[sourceIndex];
                    audio.play().catch(function () {});
                } else {
                    play(current + 1);
                }
            });

            audio.addEventListener('ended', function () { play(current + 1); });

            play(0);
        })();
    </script>

    <script>
        // 把评论区页脚 "Powered by Waline" 的链接和名字换成自己的
        (function () {
            var link = 'https://henduanzan-twikoo-d7gwh9lqi0cd62381.webapps.tcloudbase.com';   // 改成你的地址,目前先保留原地址
            var name = 'jintao';
            var box = document.getElementById('vcomments');

            function patch() {
                var a = box.querySelector('.wl-power a');
                if (!a) return;
                if (a.getAttribute('href') !== link) a.href = link;
                // 只在不一样时才改,否则改动本身会再次触发观察器,陷入死循环
                if (a.textContent !== name) a.textContent = name;
            }

            patch();
            // Waline 加载评论时会拆掉再重建这行页脚,所以要持续观察,每次重建后再改一次
            new MutationObserver(patch).observe(box, { childList: true, subtree: true });
        })();
    </script>
